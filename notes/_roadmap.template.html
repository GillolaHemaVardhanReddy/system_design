<script>
/* ============ everything below is DERIVED — never hand-set, so it cannot lie ============ */
const NS="http://www.w3.org/2000/svg";
const ST={
  banked:   {c:"--st-banked",    l:"Banked cold"},
  here:     {c:"--st-here",      l:"You are here"},
  covered:  {c:"--st-covered",   l:"Covered — not gated"},
  termslost:{c:"--st-termslost", l:"Terms lost"},
  locked:   {c:"--st-locked",    l:"Locked"}
};
const byId={}; MODULES.forEach(m=>byId[m.id]=m);
const allAtoms=MODULES.flatMap(m=>m.atoms);
const atomById={}; allAtoms.forEach(a=>atomById[a.id]=a);
const atomMod={};  MODULES.forEach(m=>m.atoms.forEach(a=>atomMod[a.id]=m));
const cnt=s=>allAtoms.filter(a=>a.s===s).length;
const modBanked=m=>m.atoms.filter(a=>a.s==="banked").length;
const cssId=s=>s.replace(/\./g,"-");

/* module status is DERIVED from its atoms. `debt` is a FLAG, not a status. */
function modStatus(m){
  if(m.atoms.some(a=>a.s==="here"))      return "here";
  if(m.atoms.some(a=>a.s==="termslost")) return "termslost";
  if(m.atoms.every(a=>a.s==="locked"))   return "locked";
  if(m.atoms.every(a=>a.s==="banked"))   return "banked";
  if(m.atoms.some(a=>a.s==="banked"||a.s==="covered")) return "covered";
  return "locked";
}
const deps={}; MODULES.forEach(m=>deps[m.id]=[]);
EDGES.forEach(([a,b])=>deps[b].push(a));
const unlocksOf=id=>MODULES.filter(m=>deps[m.id].includes(id)).map(m=>m.id);

document.getElementById("hAtoms").textContent=allAtoms.length;

/* ============ METRO LAYOUT — boustrophedon snake, one zone per phase ============ */
const W=1400, L=210, R=W-70, TOP=54, ROWH=156, R_ST=21;
const H=TOP+PHASES.length*ROWH+30;
const seq=MODULES.map(m=>m.id);                 // the trunk IS the honest teaching order
const seqIdx={}; seq.forEach((id,i)=>seqIdx[id]=i);
const rows=PHASES.map(()=>[]); MODULES.forEach(m=>rows[m.ph].push(m));

const pos={};
rows.forEach((list,ph)=>{
  const y=TOP+ph*ROWH+ROWH*0.54;
  const dir=ph%2===0?1:-1;                      // even rows L→R, odd rows R→L
  const n=list.length;
  list.forEach((m,i)=>{
    const t=n===1?0.5:i/(n-1);
    pos[m.id]={x: dir===1 ? L+(R-L)*t : R-(R-L)*t, y};
  });
});

const svg=document.getElementById("map");
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
svg.setAttribute("role","img");
svg.setAttribute("aria-label","System design module dependency map");

/* zone bands — each phase carries the forcing question that makes it necessary */
PHASES.forEach((p,ph)=>{
  const y=TOP+ph*ROWH;
  const g=document.createElementNS(NS,"g"); g.setAttribute("class","zone");
  const rect=document.createElementNS(NS,"rect");
  rect.setAttribute("x",14);rect.setAttribute("y",y+10);rect.setAttribute("width",W-28);
  rect.setAttribute("height",ROWH-20);rect.setAttribute("rx",16);
  rect.setAttribute("opacity",ph%2?0.7:0.4);g.appendChild(rect);
  const idx=document.createElementNS(NS,"text");
  idx.setAttribute("class","zidx");idx.setAttribute("x",30);idx.setAttribute("y",y+33);
  idx.textContent="PHASE "+(ph+1);g.appendChild(idx);
  const lab=document.createElementNS(NS,"text");
  lab.setAttribute("class","ztab");lab.setAttribute("x",30);lab.setAttribute("y",y+53);
  lab.textContent=p.n;g.appendChild(lab);
  const words=p.q.split(" "); const lines=[]; let cur="";
  for(const w of words){ if((cur+" "+w).trim().length>28){lines.push(cur.trim());cur=w;} else cur+=" "+w; }
  if(cur.trim())lines.push(cur.trim());
  lines.slice(0,5).forEach((ln,i)=>{
    const t=document.createElementNS(NS,"text");
    t.setAttribute("class","zq");t.setAttribute("x",30);t.setAttribute("y",y+71+i*13);
    t.textContent=ln;g.appendChild(t);
  });
  svg.appendChild(g);
});

/* the trunk — every module in teaching order, orthogonal U-turns between rows */
let d=`M ${pos[seq[0]].x} ${pos[seq[0]].y}`;
for(let i=1;i<seq.length;i++){
  const a=pos[seq[i-1]], b=pos[seq[i]];
  if(Math.abs(a.y-b.y)<1) d+=` L ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
  else{ const my=((a.y+b.y)/2).toFixed(1);
        d+=` L ${a.x.toFixed(1)} ${my} L ${b.x.toFixed(1)} ${my} L ${b.x.toFixed(1)} ${b.y.toFixed(1)}`; }
}
const glow=document.createElementNS(NS,"path");glow.setAttribute("class","trunk-glow");glow.setAttribute("d",d);svg.appendChild(glow);
const trunk=document.createElementNS(NS,"path");trunk.setAttribute("class","trunk");trunk.setAttribute("d",d);svg.appendChild(trunk);
try{svg.style.setProperty("--tlen",trunk.getTotalLength().toFixed(0));}catch(e){svg.style.setProperty("--tlen","5200");}

/* faint links = REAL prerequisites that aren't simply the previous stop on the line */
const linkEls=[];
MODULES.forEach(m=>{
  deps[m.id].forEach(dp=>{
    if(seqIdx[m.id]-1===seqIdx[dp])return;      // already riding the trunk
    const a=pos[dp], b=pos[m.id]; if(!a||!b)return;
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, off=(Math.abs(a.y-b.y)<1?-50:64);
    const path=document.createElementNS(NS,"path");
    path.setAttribute("class","link");
    path.setAttribute("d",`M ${a.x} ${a.y} Q ${mx} ${my+off}, ${b.x} ${b.y}`);
    path.dataset.from=dp;path.dataset.to=m.id;
    svg.appendChild(path);linkEls.push(path);
  });
});

/* stations */
const stEls={};
MODULES.forEach((m,i)=>{
  const p=pos[m.id], st=modStatus(m), isDebt=m.flag==="debt", isHere=st==="here";
  const g=document.createElementNS(NS,"g");
  g.setAttribute("class","st"+(st==="locked"?" locked":"")+(isDebt?" debt":"")+(isHere?" current":""));
  g.setAttribute("tabindex","0");g.setAttribute("role","button");
  g.setAttribute("aria-label",`${m.code} ${m.name}. ${ST[st].l}. ${modBanked(m)} of ${m.atoms.length} atoms banked cold.`);
  g.style.setProperty("--n",`var(${isDebt?"--st-debt":ST[st].c})`);
  g.style.setProperty("--i",i);
  g.dataset.id=m.id;

  const halo=document.createElementNS(NS,"circle");
  halo.setAttribute("class","halo");halo.setAttribute("cx",p.x);halo.setAttribute("cy",p.y);halo.setAttribute("r",R_ST+9);g.appendChild(halo);
  const ring=document.createElementNS(NS,"circle");
  ring.setAttribute("class","ring");ring.setAttribute("cx",p.x);ring.setAttribute("cy",p.y);ring.setAttribute("r",R_ST);g.appendChild(ring);
  const code=document.createElementNS(NS,"text");
  code.setAttribute("class","code");code.setAttribute("x",p.x);code.setAttribute("y",p.y);code.textContent=m.code;g.appendChild(code);
  const name=document.createElementNS(NS,"text");
  name.setAttribute("class","name");name.setAttribute("x",p.x);name.setAttribute("y",p.y+R_ST+19);name.textContent=m.name;g.appendChild(name);
  const lvt=document.createElementNS(NS,"text");
  lvt.setAttribute("class","lvtag");lvt.setAttribute("x",p.x);lvt.setAttribute("y",p.y+R_ST+33);
  lvt.textContent=`${modBanked(m)}/${m.atoms.length} banked`;g.appendChild(lvt);
  if(isHere||isDebt){
    const t=document.createElementNS(NS,"text");
    t.setAttribute("class",isHere?"youare":"debttag");
    t.setAttribute("x",p.x);t.setAttribute("y",p.y-R_ST-14);
    t.textContent=isHere?"◆ YOU ARE HERE":"⚠ DEBT — OWED BEFORE M2";g.appendChild(t);
  }

  g.addEventListener("click",()=>openCard(m.id));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openCard(m.id);}});
  g.addEventListener("mouseenter",()=>hover(m.id));
  g.addEventListener("mouseleave",()=>hover(null));
  g.addEventListener("focus",()=>hover(m.id));
  g.addEventListener("blur",()=>hover(null));
  svg.appendChild(g);stEls[m.id]=g;
});

/* hover a station → light up its ENTIRE prerequisite chain, both directions */
function chain(id,dir,set){
  (dir==="up"?deps[id]:unlocksOf(id)).forEach(nb=>{ if(!set.has(nb)){set.add(nb);chain(nb,dir,set);} });
}
function hover(id){
  if(id===null){Object.values(stEls).forEach(n=>n.classList.remove("dim"));
    linkEls.forEach(e=>e.classList.remove("hl","dim"));return;}
  const keep=new Set([id]);chain(id,"up",keep);chain(id,"down",keep);
  Object.values(stEls).forEach(n=>n.classList.toggle("dim",!keep.has(+n.dataset.id)));
  linkEls.forEach(e=>{const rel=keep.has(+e.dataset.from)&&keep.has(+e.dataset.to);
    e.classList.toggle("hl",rel);e.classList.toggle("dim",!rel);});
}

/* filters */
function matchFilter(m,f){
  const st=modStatus(m);
  if(f==="all")   return true;
  if(f==="debt")  return m.flag==="debt";
  if(f==="regate")return m.atoms.some(a=>a.s==="termslost"||a.s==="covered");
  if(f==="banked")return m.atoms.some(a=>a.s==="banked");
  return st===f;
}
document.getElementById("filters").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  document.querySelectorAll("#filters .chip").forEach(c=>c.setAttribute("aria-pressed",c===b));
  const f=b.dataset.f;
  MODULES.forEach(m=>stEls[m.id].classList.toggle("dim",!matchFilter(m,f)));
  linkEls.forEach(e=>e.classList.toggle("dim",f!=="all"&&
    !(matchFilter(byId[+e.dataset.from],f)&&matchFilter(byId[+e.dataset.to],f))));
});

/* stats + legend */
(function(){
  const banked=cnt("banked"), total=allAtoms.length, here=allAtoms.find(a=>a.s==="here");
  document.getElementById("stats").innerHTML=`
    <div class="stat"><div class="k">Banked cold</div><div class="v">${banked}<small>/${total}</small></div></div>
    <div class="stat"><div class="k">Of the map</div><div class="v">${(banked/total*100).toFixed(1)}<small>%</small></div></div>
    <div class="stat warn"><div class="k">You are here</div><div class="v" style="font-size:16px">${here?here.id:"—"}</div></div>
    <div class="stat bad"><div class="k">Re-gate due</div><div class="v">${cnt("termslost")+cnt("covered")}</div></div>`;
  document.getElementById("legend").innerHTML=
    Object.entries(ST).map(([k,v])=>`<span class="lg"><i style="background:var(${v.c})"></i>${v.l}</span>`).join("")+
    `<span class="lg"><i style="background:var(--st-debt)"></i>Debt</span>`;
})();

/* ============ MODAL ============ */
const scrim=document.getElementById("scrim"), cc=document.getElementById("cardContent"), card=document.getElementById("card");
let curMod=null, curTab="overview";

function openCard(id,tab,scrollTo){
  curMod=id; curTab=tab||"overview";
  const m=byId[id], st=modStatus(m);
  card.style.setProperty("--m",`var(${m.flag==="debt"?"--st-debt":ST[st].c})`);
  render();
  scrim.classList.add("show");
  card.scrollTop=0;
  if(scrollTo) flashAtom(scrollTo);
  document.getElementById("closeb").focus();
}
function flashAtom(aid){
  requestAnimationFrame(()=>{
    const el=document.getElementById("row-"+cssId(aid));
    if(!el)return;
    el.scrollIntoView({block:"center",behavior:"smooth"});
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  });
}

function render(){
  const m=byId[curMod], st=modStatus(m);
  const need=deps[m.id].map(x=>`<span class="tag" data-go="${x}">${byId[x].code} · ${byId[x].name}</span>`).join("")
    || `<span class="tag plain">nothing — this is the floor</span>`;
  const unl=unlocksOf(m.id).map(x=>`<span class="tag" data-go="${x}">${byId[x].code} · ${byId[x].name} →</span>`).join("")
    || `<span class="tag plain">nothing. this is the last one.</span>`;

  cc.innerHTML=`
    <div class="top">
      <div class="eyerow">
        <span class="mcode">${m.code}${m.flag==="debt"?" · ⚠ DEBT":""}</span>
        <span class="mphase">Phase ${m.ph+1} · ${PHASES[m.ph].n}</span>
        <span class="lvchip"><i></i>${ST[st].l} · ${modBanked(m)}/${m.atoms.length}</span>
      </div>
      <h2 id="mTitle">${m.name}</h2>
      <p class="obj">${m.flag==="debt"?"<b>Silently skipped — and owed before Module 2.</b> ":""}${m.atoms.length} atoms · <b>${modBanked(m)} banked cold</b></p>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="overview" aria-selected="${curTab==="overview"}">Why it's here</button>
        <button class="tab" role="tab" data-tab="atoms"    aria-selected="${curTab==="atoms"}">Atoms <span class="n">${m.atoms.length}</span></button>
      </div>
    </div>
    ${curTab==="overview"?overview(m,need,unl):atomsView(m)}
    <div class="foot">${curTab==="overview"
      ? `<b>Banked cold</b> = passed a gate from memory, in a <b>later</b> session, <b>terms included</b>. Everything else proves nothing. Colours are computed from <code>trackers/STATUS.json</code>, so a <code>/gate</code> pass moves this map — and it cannot flatter you.`
      : `<b>Solid arrow</b> = a prerequisite <b>inside this module</b>. <b>Dashed chip</b> = a prerequisite in <b>another module</b> — click it to jump straight to that atom. <b>Hover any node</b> to light up everything it depends on and everything that depends on it.`}</div>`;

  cc.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{curTab=b.dataset.tab;render();card.scrollTop=0;}));
  cc.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>openCard(+b.dataset.go)));
  cc.querySelectorAll("[data-goatom]").forEach(b=>b.addEventListener("click",()=>{
    const t=b.dataset.goatom; openCard(atomMod[t].id,"atoms",t);
  }));
  if(curTab==="atoms") wireAtomGraph(m);
}

function overview(m,need,unl){
  return `<div class="body-in">
    <div class="sect"><div class="h">Why it's here — what broke</div><div class="chain c-broke">${m.broke}</div></div>
    <div class="sect"><div class="h">What it buys you</div><div class="chain c-buys">${m.buys}</div></div>
    <div class="sect"><div class="h">What it costs — what breaks next</div><div class="chain c-costs">${m.costs}</div></div>
    <div class="sect"><div class="h">Needs first</div><div class="tags">${need}</div></div>
    <div class="sect"><div class="h">Unlocks</div><div class="tags">${unl}</div></div>
  </div>`;
}

/* ---- THE ATOMS VIEW: a real sub-atom dependency graph, then the list ---- */
function atomsView(m){
  const inMod=new Set(m.atoms.map(a=>a.id));

  // longest-path depth over IN-MODULE deps → one band per level
  const depth={};
  const calc=id=>{
    if(depth[id]!==undefined)return depth[id];
    depth[id]=0;                                              // cycle guard
    const ds=(atomById[id]?.deps||[]).filter(x=>inMod.has(x));
    depth[id]=ds.length?1+Math.max(...ds.map(calc)):0;
    return depth[id];
  };
  m.atoms.forEach(a=>calc(a.id));

  const levels=[];
  m.atoms.forEach(a=>{ const L=depth[a.id]; (levels[L]=levels[L]||[]).push(a); });

  // wrap wide levels so nothing gets crushed
  const PER=6, NW=76, NH=27, GX=18, GY=48, PAD=12, LX=44;
  const bands=[];
  levels.forEach((as,l)=>{ if(!as)return;
    for(let i=0;i<as.length;i+=PER) bands.push({lvl:l,atoms:as.slice(i,i+PER),first:i===0}); });

  const cols=Math.max(...bands.map(b=>b.atoms.length));
  const inner=cols*NW+(cols-1)*GX;
  const GW=LX+PAD*2+inner;
  const GH=PAD*2+(bands.length-1)*GY+NH;

  const P={};
  bands.forEach((b,bi)=>{
    const y=PAD+bi*GY;
    const rowW=b.atoms.length*NW+(b.atoms.length-1)*GX;
    const x0=LX+PAD+(inner-rowW)/2;
    b.atoms.forEach((a,i)=>{P[a.id]={x:x0+i*(NW+GX),y};});
  });

  let edges="";
  m.atoms.forEach(a=>(a.deps||[]).forEach(dp=>{
    if(!inMod.has(dp)||!P[dp]||!P[a.id])return;
    const A=P[dp],B=P[a.id];
    const x1=A.x+NW/2,y1=A.y+NH,x2=B.x+NW/2,y2=B.y-5,my=(y1+y2)/2;
    edges+=`<path class="aedge" data-from="${dp}" data-to="${a.id}" d="M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}"></path>`;
  }));

  const nodes=m.atoms.map(a=>{
    const p=P[a.id]; if(!p)return"";
    return `<g class="an${a.s==="locked"?" locked":""}" data-id="${a.id}" tabindex="0" role="button"
        style="--a:var(${ST[a.s].c})" aria-label="Atom ${a.id}. ${ST[a.s].l}.">
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="7"></rect>
      <text x="${p.x+NW/2}" y="${p.y+NH/2+.5}">${a.id}</text></g>`;
  }).join("");

  const lvl=bands.map((b,bi)=>b.first
    ? `<text class="alvl" x="8" y="${PAD+bi*GY+NH/2+4}">L${b.lvl}</text>`:"").join("");

  const rows=m.atoms.map(a=>{
    const ext=(a.deps||[]).filter(x=>!inMod.has(x));
    const inn=(a.deps||[]).filter(x=>inMod.has(x));
    const chips=[
      ...inn.map(x=>`<b>${x}</b>`),
      ...ext.map(x=>`<span class="xdep" data-goatom="${x}">${x} · ${atomMod[x].code}</span>`)
    ].join(" ");
    return `<div class="arow${a.s==="locked"?" locked":""}" id="row-${cssId(a.id)}" style="--a:var(${ST[a.s].c})">
      <div class="aid">${a.id}</div>
      <div>
        <div class="at">${a.t}</div>
        <div class="ameta">↳ ${a.ref}</div>
        ${(a.deps&&a.deps.length)?`<div class="adep">needs: ${chips}</div>`:``}
        ${a.note?`<div class="adep">· ${a.note}</div>`:``}
        ${a.trap?`<div class="atrap"><b>⚠ TRAP —</b> ${a.trap}</div>`:``}
      </div>
      <div class="pill">${ST[a.s].l}</div>
    </div>`;
  }).join("");

  return `<div class="body-in">
    <div class="sect">
      <div class="h">Sub-atom dependencies — what must be true before what</div>
      <div class="agraph">
        <svg viewBox="0 0 ${GW} ${GH}" style="min-width:${Math.max(GW,400)}px;width:100%">
          <defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 z" fill="var(--line)"></path></marker></defs>
          ${lvl}${edges}${nodes}
        </svg>
      </div>
    </div>
    <div class="sect"><div class="h">The atoms — status, tagged source, and its trap</div>
      <div class="alist">${rows}</div></div>
  </div>`;
}

/* hover an atom → light its whole in-module chain, both directions; click → jump to its row */
function wireAtomGraph(m){
  const inMod=new Set(m.atoms.map(a=>a.id));
  const up={},down={};
  m.atoms.forEach(a=>{
    up[a.id]=(a.deps||[]).filter(x=>inMod.has(x));
    down[a.id]=m.atoms.filter(x=>(x.deps||[]).includes(a.id)).map(x=>x.id);
  });
  const walk=(id,dir,set)=>(dir==="up"?up[id]:down[id]).forEach(n=>{if(!set.has(n)){set.add(n);walk(n,dir,set);}});

  const ns=[...cc.querySelectorAll(".an")], es=[...cc.querySelectorAll(".aedge")];
  const clear=()=>{ns.forEach(n=>n.classList.remove("dim","cur"));es.forEach(e=>e.classList.remove("hl","dim"));};
  const lite=id=>{
    const keep=new Set([id]); walk(id,"up",keep); walk(id,"down",keep);
    ns.forEach(n=>{n.classList.toggle("dim",!keep.has(n.dataset.id));n.classList.toggle("cur",n.dataset.id===id);});
    es.forEach(e=>{const rel=keep.has(e.dataset.from)&&keep.has(e.dataset.to);
      e.classList.toggle("hl",rel);e.classList.toggle("dim",!rel);});
  };
  ns.forEach(n=>{
    const id=n.dataset.id;
    n.addEventListener("mouseenter",()=>lite(id));
    n.addEventListener("focus",()=>lite(id));
    n.addEventListener("mouseleave",clear);
    n.addEventListener("blur",clear);
    n.addEventListener("click",()=>flashAtom(id));
    n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flashAtom(id);}});
  });
}

function closeCard(){scrim.classList.remove("show");}
document.getElementById("closeb").addEventListener("click",closeCard);
scrim.addEventListener("click",e=>{if(e.target===scrim)closeCard();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCard();});

/* hero → app */
function enter(){document.body.classList.add("open");
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches)document.body.classList.add("anim");}
document.getElementById("coreBtn").addEventListener("click",enter);
document.getElementById("homeBtn").addEventListener("click",()=>{document.body.classList.remove("open","anim");closeCard();});

document.getElementById("themeBtn").addEventListener("click",()=>{
  const root=document.documentElement;
  const cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  root.setAttribute("data-theme",cur==="dark"?"light":"dark");
});
</script>
